<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVault - 安全加密工具</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="bg-wrapper">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>
    
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                    <span class="logo-text">CryptoVault</span>
                </div>
                <nav class="header-nav">
                    <button class="nav-item active" data-tab="dashboard">
                        <i class="fas fa-chart-line"></i>
                        <span>控制台</span>
                    </button>
                    <button class="nav-item" data-tab="config">
                        <i class="fas fa-sliders"></i>
                        <span>配置</span>
                    </button>
                    <button class="nav-item" data-tab="files">
                        <i class="fas fa-database"></i>
                        <span>映射表</span>
                    </button>
                </nav>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="header-status">准备就绪</span>
                </div>
            </div>
        </header>

        <main class="app-main">
            <section id="dashboard" class="tab-content active">
                <div class="welcome-section">
                    <div class="welcome-glass">
                        <div class="welcome-content">
                            <h1><span class="wave">👋</span> 欢迎使用</h1>
                            <p>安全、高效的文件加密解决方案，保护您的数据安全</p>
                        </div>
                        <div class="encryption-type">
                            <i class="fas fa-lock"></i>
                            <span id="current-algo">AES-256</span>
                        </div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-file-shield"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="encrypted-count">0</div>
                            <div class="stat-label">已加密文件</div>
                        </div>
                        <div class="stat-trend up">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fas fa-folder-open"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="paths-count">0</div>
                            <div class="stat-label">监控路径</div>
                        </div>
                        <div class="stat-trend stable">
                            <i class="fas fa-minus"></i>
                        </div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon purple">
                            <i class="fas fa-shield-virus"></i>
                        </div>
                        <div class="stat-info">
                            <div class="stat-value" id="security-level">高</div>
                            <div class="stat-label">安全等级</div>
                        </div>
                        <div class="stat-trend up">
                            <i class="fas fa-check"></i>
                        </div>
                    </div>
                </div>

                <div class="operation-section">
                    <div class="glass-panel">
                        <div class="panel-header">
                            <h3><i class="fas fa-terminal"></i> 操作控制</h3>
                            <div class="operation-status" id="operation-status">
                                <i class="fas fa-circle"></i> 待命
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button id="start-encrypt" class="action-btn primary">
                                <i class="fas fa-lock"></i>
                                <span>开始加密</span>
                            </button>
                            <button id="start-decrypt" class="action-btn secondary">
                                <i class="fas fa-unlock"></i>
                                <span>开始解密</span>
                            </button>
                            <button id="stop-operation" class="action-btn danger" disabled>
                                <i class="fas fa-stop"></i>
                                <span>停止</span>
                            </button>
                        </div>

                        <div class="progress-wrapper">
                            <div class="progress-header">
                                <span id="progress-text">准备就绪</span>
                                <span id="progress-percent">0%</span>
                            </div>
                            <div class="progress-bar-track">
                                <div class="progress-bar-fill" id="progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="logs-section">
                    <div class="glass-panel">
                        <div class="panel-header">
                            <h3><i class="fas fa-terminal"></i> 系统日志</h3>
                            <div class="log-controls">
                                <button id="clear-logs" class="control-btn">
                                    <i class="fas fa-trash"></i> 清空
                                </button>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="auto-scroll" checked>
                                    <span class="toggle-slider"></span>
                                    <span class="toggle-label">自动滚动</span>
                                </label>
                            </div>
                        </div>
                        <div class="log-container">
                            <div id="log-content" class="log-content"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="config" class="tab-content">
                <div class="config-page">
                    <div class="page-header">
                        <h2><i class="fas fa-sliders-h"></i> 配置管理</h2>
                        <p>自定义加密设置以匹配您的需求</p>
                    </div>

                    <div class="config-grid">
                        <div class="config-card">
                            <div class="card-title">
                                <i class="fas fa-key"></i>
                                <h3>基础配置</h3>
                            </div>
                            <form id="config-form" class="config-form">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-lock"></i>
                                        加密密码
                                    </label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="password" name="password" 
                                               class="form-input" placeholder="请输入安全密码">
                                        <button type="button" id="toggle-password" class="password-toggle">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-microchip"></i>
                                        加密算法
                                    </label>
                                    <div class="select-wrapper">
                                        <select id="encrypt-type" name="encrypt_type" class="form-select">
                                            <option value="aes">🔐 AES-256 (推荐)</option>
                                            <option value="blowfish">🔑 Blowfish</option>
                                            <option value="xor">⚡ XOR</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="fas fa-folder-tree"></i>
                                        目标路径 (每行一个)
                                    </label>
                                    <textarea id="target-paths" name="target_paths" 
                                              class="form-textarea" rows="4"
                                              placeholder="/home/user/Documents
/home/user/Photos
/important/files"></textarea>
                                </div>

                                <div class="form-row">
                                    <div class="form-group">
                                        <label class="form-label">
                                            <i class="fas fa-file-import"></i>
                                            混淆后缀
                                        </label>
                                        <input type="text" id="obfuscate-suffix" 
                                               name="obfuscate_suffix" 
                                               class="form-input" value=".dat">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label">
                                            <i class="fas fa-save"></i>
                                            映射存储路径
                                        </label>
                                        <input type="text" id="map-storage-path" 
                                               name="map_storage_path" 
                                               class="form-input" 
                                               placeholder="默认 tmp/">
                                    </div>
                                </div>

                                <div class="form-actions">
                                    <button type="button" id="load-config" class="btn-ghost">
                                        <i class="fas fa-download"></i> 加载配置
                                    </button>
                                    <button type="submit" class="btn-primary">
                                        <i class="fas fa-save"></i> 保存配置
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div class="info-card">
                            <div class="info-card-header">
                                <i class="fas fa-shield-heart"></i>
                                <h3>安全提示</h3>
                            </div>
                            <ul class="info-list">
                                <li>
                                    <i class="fas fa-check-circle"></i>
                                    使用强密码，长度至少 8 位
                                </li>
                                <li>
                                    <i class="fas fa-check-circle"></i>
                                    备份映射文件，否则无法恢复
                                </li>
                                <li>
                                    <i class="fas fa-check-circle"></i>
                                    AES 算法提供最高安全性
                                </li>
                                <li>
                                    <i class="fas fa-check-circle"></i>
                                    加密前请做好数据备份
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>

            <section id="files" class="tab-content">
                <div class="files-page">
                    <div class="page-header">
                        <h2><i class="fas fa-database"></i> 加密映射表</h2>
                        <div class="header-actions">
                            <button id="refresh-files" class="btn-ghost">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                    </div>

                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-files" 
                               placeholder="搜索文件...">
                    </div>

                    <div class="files-stats">
                        <div class="stat-item">
                            <i class="fas fa-file-alt"></i>
                            <span id="total-files">0</span> 个文件
                        </div>
                    </div>

                    <div class="files-table-container">
                        <div class="files-table-wrapper">
                            <table class="files-table">
                                <thead>
                                    <tr>
                                        <th>原始文件</th>
                                        <th>加密文件</th>
                                        <th>MD5</th>
                                        <th>盐值</th>
                                        <th>大小</th>
                                        <th>目标目录</th>
                                    </tr>
                                </thead>
                                <tbody id="file-list">
                                    <tr class="empty-row">
                                        <td colspan="6">
                                            <div class="empty-state">
                                                <i class="fas fa-folder-open"></i>
                                                <p>暂无加密文件</p>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
